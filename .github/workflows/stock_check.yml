name: Global Stock Alerts

on:
  schedule:
    # 1. 台股盤前：週一至週五 08:30 CST (UTC 00:30) - 晨報 + 台股檢查
    - cron: '30 0 * * 1-5'
    # 2. 美股盤前：週一至週五 21:00 CST (UTC 13:00) - 美股盤前檢查
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '選擇執行模式 (ALL / TWD / USD / MORNING)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - TWD
          - USD
          - MORNING
      force_notify:
        description: '強制推播 LINE (不論有無訊號)'
        required: true
        default: false
        type: boolean

jobs:
  check-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance

      - name: Run Quantitative Engine
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PORTFOLIO_SHEET_URL: ${{ secrets.PORTFOLIO_SHEET_URL }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'ALL' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          python main.py

      - name: Auto-commit state cache & dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state_cache.json data.json || true
          git commit -m "Auto-update stock state & dashboard data [skip ci]" || exit 0
          git push
