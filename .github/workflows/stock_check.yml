name: Stock Quantitative Check

on:
  # 修改 main.py 或 workflow 存檔時，立即自動執行測試
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/stock_check.yml'

  # 台美股盤中每 30 分鐘高頻巡檢
  schedule:
    # 1. 台股盤中巡檢：週一至週五 台灣時間 09:00 ~ 14:30 (UTC 01:00 ~ 06:30)
    - cron: '*/30 1-6 * * 1-5'
    # 2. 美股盤中巡檢：週一至週五 台灣時間 21:00 ~ 隔日 05:30 (UTC 13:00 ~ 21:30)
    - cron: '*/30 13-21 * * 1-5'

  # 手動點擊執行 (強制發送 LINE 總覽測試)
  workflow_dispatch:

# 防止同時觸發兩個排程造成 Git 衝突
concurrency:
  group: stock-quant-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run Quantitative Engine
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py

      - name: Auto-commit state cache & dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: intraday update quant state and dashboard"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "資料無異動，略過提交。"
          fi
