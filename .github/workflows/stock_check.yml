name: Global Stock Alerts

on:
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      run_mode:
        description: '執行模式 (ALL / TWD / USD)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - TWD
          - USD
      force_notify:
        description: '強制推播 LINE'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance

      - name: Run Quantitative Engine
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PORTFOLIO_SHEET_URL: ${{ secrets.PORTFOLIO_SHEET_URL }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'ALL' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          python main.py

      - name: Auto-commit state cache & dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || git rebase --abort
          git add state_cache.json data.json || true
          if git diff --staged --quiet; then
            echo "無資料變更，跳過 Commit"
          else
            git commit -m "Auto-update state & dashboard data"
            git push origin main
          fi
