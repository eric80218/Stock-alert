name: Stock Quantitative Check

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/stock_check.yml'
  schedule:
    - cron: '0 1-6,13-22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-quant-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run Quantitative Engine
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py

      - name: Auto-commit state cache & dashboard data if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: dynamic eps valuation update"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "資料無實質異動，略過 Git 提交。"
          fi
