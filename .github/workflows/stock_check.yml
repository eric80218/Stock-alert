name: Stock Quantitative Check

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/stock_check.yml'
  schedule:
    # 1. 台股收盤後 (週一至週五 台灣時間 14:00 -> UTC 06:00)
    - cron: '0 6 * * 1-5'
    # 2. 美股收盤後 (週二至週六 台灣時間 05:00 -> UTC 21:00)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

# 防止同時觸發兩個工作流程導致 Git Push 衝突
concurrency:
  group: stock-quant-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run Quantitative Engine
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python main.py

      - name: Auto-commit state cache & dashboard data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: update quant state and dashboard"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "資料無異動，略過提交。"
          fi
