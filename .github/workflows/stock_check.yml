name: Global Stock Alerts

on:
  schedule:
    # ── 🇹🇼 台股時段 (週一至週五) ──
    # 1. 08:30 CST (UTC 00:30) - 台股開盤前瞻
    - cron: '30 0 * * 1-5'
    # 2. 10:30 CST (UTC 02:30) - 台股盤中早盤洗盤檢查
    - cron: '30 2 * * 1-5'
    # 3. 13:45 CST (UTC 05:45) - 🌟 【新增】台股收盤結算與當日損益更新
    - cron: '45 5 * * 1-5'

    # ── 🇺🇸 美股時段 (週一至週五) ──
    # 4. 21:00 CST (UTC 13:00) - 美股盤前戰略 (抓取 preMarketPrice)
    - cron: '0 13 * * 1-5'
    # 5. 23:30 CST (UTC 15:30) - 美股開盤波動確認
    - cron: '30 15 * * 1-5'

  workflow_dispatch:
    inputs:
      run_mode:
        description: '執行模式 (ALL / TWD / USD)'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - TWD
          - USD
      force_notify:
        description: '強制推播 LINE'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Git Pull Latest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || git rebase --abort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance

      - name: Run Quantitative Engine
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PORTFOLIO_SHEET_URL: ${{ secrets.PORTFOLIO_SHEET_URL }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'ALL' }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: |
          python main.py

      - name: Auto-commit state cache & dashboard data
        run: |
          git add state_cache.json data.json || true
          if git diff --staged --quiet; then
            echo "💡 數據無變更，跳過 Commit。"
          else
            git commit -m "Auto-update state & dashboard data [skip ci]"
            git push origin main
          fi
